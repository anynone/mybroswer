<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Polaris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="btn-newtab" title="新建标签页 (Ctrl+T)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>
  <div id="toolbar">
    <button id="btn-back" class="nav" title="后退 (Alt+←)">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button id="btn-forward" class="nav" title="前进 (Alt+→)">
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
    </button>
    <button id="btn-reload" class="nav" title="刷新 (Ctrl+R)">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="btn-home" class="nav" title="主页">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <div id="address-wrap">
      <span id="lock"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="搜索或输入网址">
      <button id="zoom-chip" class="hidden" title="重置缩放 (Ctrl+0)">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2Z"/></svg>
        <span id="zoom-val">100%</span>
      </button>
      <button id="btn-star" title="收藏此页 (Ctrl+D)">
        <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>
    </div>
    <div id="tz-chip" title="时区设置，点击修改">
      <span class="tz-ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3Z"/></svg></span>
      <span id="tz-text">--</span>
    </div>
    <div id="ext-bar">
      <button id="btn-ext" title="扩展管理">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4v1.5a2.5 2.5 0 0 1-5 0V5H5a2 2 0 0 0-2 2v4h1.5a2.5 2.5 0 0 1 0 5H3v4a2 2 0 0 0 2 2h4v-1.5a2.5 2.5 0 0 1 5 0V21h4a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5Z"/></svg>
      </button>
      <div id="ext-icons"></div>
    </div>
    <button id="btn-menu" title="自定义及控制 Polaris">
      <svg class="ic-dots" viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0-2-2 2 2 0 0 0 2 2Zm0 2a2 2 0 1 0 2 2 2 2 0 0 0-2-2Zm0 6a2 2 0 1 0 2 2 2 2 0 0 0-2-2Z"/></svg>
      <svg class="ic-open" viewBox="0 0 24 24"><path d="M12 3.4a1.9 1.9 0 0 1 1.65 2.84L12.9 7.5a1.9 1.9 0 0 1-1.8 0l-.75-1.26A1.9 1.9 0 0 1 12 3.4z"/><path d="M12 3.4a1.9 1.9 0 0 1 1.65 2.84L12.9 7.5a1.9 1.9 0 0 1-1.8 0l-.75-1.26A1.9 1.9 0 0 1 12 3.4z" transform="rotate(120 12 12)"/><path d="M12 3.4a1.9 1.9 0 0 1 1.65 2.84L12.9 7.5a1.9 1.9 0 0 1-1.8 0l-.75-1.26A1.9 1.9 0 0 1 12 3.4z" transform="rotate(240 12 12)"/></svg>
    </button>
  </div>
  <div id="bm-bar" class="hidden"></div>

  <div id="findbar" class="hidden">
    <input id="find-input" type="text" spellcheck="false" placeholder="查找">
    <span id="find-count">0/0</span>
    <button id="find-prev" title="上一个 (Shift+Enter)">
      <svg viewBox="0 0 24 24"><path d="M12 6 6.7 11.3l1.4 1.4L11 9.8V19h2V9.8l2.9 2.9 1.4-1.4z"/></svg>
    </button>
    <button id="find-next" title="下一个 (Enter)">
      <svg viewBox="0 0 24 24"><path d="M12 18l5.3-5.3-1.4-1.4L13 14.2V5h-2v9.2l-2.9-2.9-1.4 1.4z"/></svg>
    </button>
    <button id="find-close" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
