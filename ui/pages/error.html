<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>无法访问</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 14px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #202124; background: #fff; user-select: none;
    }
    main { text-align: center; padding: 40px; }
    .icon { font-size: 56px; }
    h1 { font-size: 20px; font-weight: 500; margin: 14px 0 8px; }
    .code { color: #5f6368; margin: 2px 0; }
    .url { color: #9aa0a6; font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
    .row { margin-top: 26px; display: flex; gap: 14px; justify-content: center; }
    button, a.btn {
      padding: 9px 24px; border-radius: 18px; border: 1px solid #dadce0; cursor: pointer;
      font: inherit; background: #fff; color: #1a73e8; text-decoration: none; display: inline-block;
    }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button:hover, a.btn:hover { background: #f1f3f4; }
  </style>
</head>
<body>
  <main>
    <div class="icon">😦</div>
    <h1>无法访问此页面</h1>
    <p class="code" id="code"></p>
    <p class="code" id="desc"></p>
    <p class="url" id="url"></p>
    <div class="row">
      <button class="primary" id="retry">重新加载</button>
      <a class="btn" href="browser://newtab/">返回新标签页</a>
    </div>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      document.getElementById('code').textContent = '错误码: ' + (q.get('code') || '-');
      document.getElementById('desc').textContent = q.get('desc') || '';
      document.getElementById('url').textContent = q.get('url') || '';
      document.getElementById('retry').onclick = function () {
        var u = q.get('url');
        if (u && /^(https?|file|browser):/i.test(u)) location.href = u;
        else location.href = 'browser://newtab/';
      };
    })();
  </script>
</body>
</html>
