<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>下载内容</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px 20px;
      background: #f8f9fa;
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #202124;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 16px; }
    .item {
      background: #fff; border: 1px solid #e8eaed; border-radius: 12px;
      padding: 14px 18px; margin-bottom: 12px;
    }
    .item .name { font-weight: 600; word-break: break-all; }
    .item .url { color: #5f6368; font-size: 12.5px; word-break: break-all; margin: 2px 0 6px; }
    .item .st { font-size: 12.5px; color: #5f6368; margin-bottom: 8px; }
    .item .st.done { color: #188038; }
    .item .st.err { color: #d93025; }
    .bar { height: 4px; border-radius: 2px; background: #e8eaed; overflow: hidden; margin: 6px 0 10px; }
    .bar i { display: block; height: 100%; background: #1a73e8; transition: width .2s; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .acts button {
      padding: 6px 14px; border: 1px solid #dadce0; border-radius: 16px;
      background: #fff; cursor: pointer; font: inherit; color: #1a73e8;
    }
    .acts button:hover { background: #f1f3f4; }
    .acts button.warn { color: #d93025; }
    .empty { color: #5f6368; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <main>
    <h1>下载内容</h1>
    <div id="list"></div>
  </main>
  <script>
    (function () {
      var P = window.polaris;
      function esc(s) { var d = document.createElement('span'); d.textContent = s || ''; return d.innerHTML; }
      function size(n) {
        if (!n) return '';
        if (n < 1024) return n + ' B';
        if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1048576).toFixed(1) + ' MB';
      }
      function stateText(d) {
        if (d.state === 'completed') return ['已完成', 'done'];
        if (d.state === 'cancelled') return ['已取消', 'err'];
        if (d.state === 'interrupted') return ['已中断', 'err'];
        if (d.state === 'paused') return ['已暂停 ' + size(d.received) + (d.total ? ' / ' + size(d.total) : ''), ''];
        return ['下载中 ' + size(d.received) + (d.total ? ' / ' + size(d.total) : ''), ''];
      }
      function render(list) {
        var box = document.getElementById('list');
        box.innerHTML = '';
        if (!list || !list.length) {
          box.innerHTML = '<div class="empty">暂无下载内容<br><span style="font-size:12.5px">下载的文件会显示在这里</span></div>';
          return;
        }
        for (var i = 0; i < list.length; i++) {
          (function (d) {
            var st = stateText(d);
            var el = document.createElement('div');
            el.className = 'item';
            var pct = d.total ? Math.min(100, Math.round(d.received * 100 / d.total)) : 0;
            var html =
              '<div class="name">' + esc(d.filename) + '</div>' +
              '<div class="url">' + esc(d.url) + '</div>' +
              '<div class="st ' + st[1] + '">' + st[0] + '</div>';
            if (d.state === 'progressing' && d.total) {
              html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
            }
            html += '<div class="acts">';
            if (d.state === 'progressing') html += '<button data-a="pause">暂停</button><button class="warn" data-a="cancel">取消</button>';
            if (d.state === 'paused') html += '<button data-a="resume">继续</button><button class="warn" data-a="cancel">取消</button>';
            if (d.state === 'completed') html += '<button data-a="open">打开</button><button data-a="folder">打开所在文件夹</button>';
            if (d.state === 'cancelled' || d.state === 'interrupted') html += '<button data-a="retry">重新下载</button>';
            html += '</div>';
            el.innerHTML = html;
            el.querySelectorAll('button[data-a]').forEach(function (b) {
              b.onclick = function () { P.downloads.act(d.id, b.dataset.a).then(load).catch(function () {}); };
            });
            box.appendChild(el);
          })(list[i]);
        }
      }
      function load() {
        P.downloads.list().then(render).catch(function () {});
      }
      P.onDlChanged(load);
      load();
    })();
  </script>
</body>
</html>
