<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>菜单</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      font: 13px/1.4 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #202124;
      overflow: hidden;
    }
    /* 独立打开（截图/预览）时给出底色衬托 */
    body.standalone { padding: 10px; background: #dee1e6; }
    body.standalone .panel { position: relative; margin-left: auto; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25); }

    .panel {
      width: 300px;
      margin-left: auto;   /* 浮层视图宽 308 = 面板 300 + 右缘间距 8 */
      background: #fff;
      border-radius: 10px;
      padding: 6px 0;
    }
    body.sub { background: transparent; }
    body.sub .panel { width: 232px; margin: 0; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.05); }
    body.sub, body.sub html { height: auto; }
    hr { border: 0; border-top: 1px solid #e8eaed; margin: 5px 0; }
    .mi {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      height: 32px;
    }
    .mi:hover { background: #f1f3f4; }
    .mi .ic {
      flex: none;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
    }
    .mi .ic svg { width: 16px; height: 16px; fill: currentColor; }
    /* 文字紧随图标左对齐；快捷键/箭头推到行末右对齐 */
    .mi .k { color: #9aa0a6; font-size: 12px; margin-left: auto; flex: none; }
    .mi .arrow { color: #9aa0a6; margin-left: auto; font-size: 15px; flex: none; }

    /* 子菜单组：子页模式（独立浮层视图）显示其中一组 */
    .page-sub { display: none; }
    .page-sub.visible { display: block; }

    /* 隐身窗口深色配色 */
    body.incognito { background: #292a2d; color: #e8eaed; }
    body.incognito.standalone { background: #202124; }
    body.incognito .panel { background: #292a2d; }
    body.incognito .mi:hover { background: #3c4043; }
    body.incognito .mi .ic { color: #bdc1c6; }
    body.incognito hr { border-top-color: #3c4043; }
    body.incognito .k, body.incognito .arrow { color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="page-main">
      <div class="mi" data-act="newtab">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>新标签页<span class="k">Ctrl+T</span>
      </div>
      <div class="mi" data-act="incognito">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2C7.58 2 4 5.13 4 9v2.5A3.5 3.5 0 0 0 5.5 18H6a6 6 0 0 0 12 0h.5A3.5 3.5 0 0 0 20 11.5V9c0-3.87-3.58-7-8-7zm-6 8c0-2.76 2.69-5 6-5s6 2.24 6 5v1H6v-1zm2 9a4 4 0 0 1-4-4h12a4 4 0 0 1-4 4H8z"/></svg></span>新建隐身窗口<span class="k">Ctrl+Shift+N</span>
      </div>
      <hr>
      <div class="mi has-sub" data-sub="history">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L8.8 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></span>历史记录<span class="arrow">‹</span>
      </div>
      <div class="mi" data-act="downloads">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></span>下载内容<span class="k">Ctrl+J</span>
      </div>
      <div class="mi has-sub" data-sub="bookmarks">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2zm0 15-5-2.18L7 18V5h10z"/></svg></span>书签<span class="arrow">‹</span>
      </div>
      <hr>
      <div class="mi" data-act="zoom-out">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></span>缩小<span class="k">Ctrl+-</span>
      </div>
      <div class="mi" data-act="zoom-in">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>放大<span class="k">Ctrl++</span>
      </div>
      <div class="mi" data-act="fullscreen">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></span>全屏<span class="k">F11</span>
      </div>
      <hr>
      <div class="mi" data-act="find">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>查找…<span class="k">Ctrl+F</span>
      </div>
      <div class="mi" data-act="print">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8zm3-7a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm-1-9H6v4h12V3z"/></svg></span>打印…<span class="k">Ctrl+P</span>
      </div>
      <hr>
      <div class="mi has-sub" data-sub="tools">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg></span>更多工具<span class="arrow">‹</span>
      </div>
      <hr>
      <div class="mi" data-act="settings">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.64 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.23.09.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg></span>设置
      </div>
      <div class="mi" data-act="version">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg></span>帮助 / 关于 Polaris
      </div>
      <div class="mi" data-act="quit">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M10.09 15.59 11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67zM19 3H5a2 2 0 0 0-2 2v4h2V5h14v14H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg></span>退出
      </div>
    </div>

    <!-- 子菜单组（子页模式 = 独立浮层视图本体） -->
    <div class="page-sub" id="page-sub-history">
      <div class="mi" data-act="history-page">历史记录页</div>
      <div class="mi" data-act="history-closed">最近关闭的标签页</div>
      <div class="mi" data-act="cleardata">清除浏览数据…<span class="k">Ctrl+Shift+Del</span></div>
    </div>
    <div class="page-sub" id="page-sub-bookmarks">
      <div class="mi" data-act="bookmark-add">收藏此页<span class="k">Ctrl+D</span></div>
      <div class="mi" data-act="bookmarks-page">书签管理器</div>
      <div class="mi" data-act="bookmarks-bar">显示/隐藏书签栏<span class="k">Ctrl+Shift+B</span></div>
    </div>
    <div class="page-sub" id="page-sub-tools">
      <div class="mi" data-act="cleardata">清除浏览数据…<span class="k">Ctrl+Shift+Del</span></div>
      <div class="mi" data-act="tasks">任务管理器<span class="k">Shift+Esc</span></div>
      <div class="mi" data-act="extensions">扩展管理</div>
      <div class="mi" data-act="devtools">开发者工具<span class="k">F12</span></div>
    </div>
  </div>
  <script>
    (function () {
      var P = window.polaris;
      var q = new URLSearchParams(location.search);
      if (q.get('incognito') === '1') document.body.classList.add('incognito');
      if (q.get('standalone') === '1') document.body.classList.add('standalone');
      var SUB_MODE = q.get('mode') === 'sub';
      if (SUB_MODE) document.body.classList.add('sub');

      function reportSize() {
        var h = document.body.scrollHeight;
        if (P && P.menu && P.menu.size) P.menu.size(h).catch(function () {});
      }

      document.body.addEventListener('click', function (e) {
        var mi = e.target.closest('.mi[data-act]');
        if (mi && P && P.menu) P.menu.act(mi.dataset.act);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && P && P.menu) P.menu.act('__close');
      });

      if (SUB_MODE) {
        // 子菜单浮层页：主进程指定显示哪一组；hover 进出通知主进程保持/缓冲收起
        if (P && P.menu && P.menu.onSub) {
          P.menu.onSub(function (name) {
            if (!name) return;
            window.__subShown = name;
            document.getElementById('page-main').style.display = 'none';
            document.querySelectorAll('.page-sub').forEach(function (p) {
              p.classList.toggle('visible', p.id === 'page-sub-' + name);
            });
            if (P.menu.size) reportSize();
          });
        }
        var hovered = false;
        document.addEventListener('mouseenter', function () {
          hovered = true;
          if (P && P.menu && P.menu.subHover) P.menu.subHover(true).catch(function () {});
        }, true);
        document.addEventListener('mouseleave', function () {
          // 页面加载初期的 mouseleave（鼠标从未进入过）不视为离开，避免刚弹出即被收起
          if (!hovered) return;
          hovered = false;
          if (P && P.menu && P.menu.subHover) P.menu.subHover(false).catch(function () {});
        }, true);
      } else {
        // 父菜单页：悬停约 0.5s / 点击 → 请求主进程弹出子菜单浮层。
        // 收起时机与 Chrome 一致：移到其它普通项、或离开整个菜单面板才收起；
        // 从行直接移向子菜单（行 mouseleave）不触发收起——否则移入途中的缓冲倒计时
        // 会与"进入子菜单"的上报赛跑，移动稍慢子菜单就被收掉（时灵时不灵的根因）。
        document.querySelectorAll('.mi.has-sub').forEach(function (row) {
          var timer = null;
          row.addEventListener('mouseenter', function () {
            clearTimeout(timer);
            timer = setTimeout(function () {
              if (P && P.menu && P.menu.sub) P.menu.sub(row.dataset.sub, row.offsetTop).catch(function () {});
            }, 500);
          });
          row.addEventListener('mouseleave', function () { clearTimeout(timer); });
          row.addEventListener('click', function () {
            clearTimeout(timer);
            if (P && P.menu && P.menu.sub) P.menu.sub(row.dataset.sub, row.offsetTop).catch(function () {});
          });
        });
        document.querySelectorAll('.mi:not(.has-sub)').forEach(function (row) {
          row.addEventListener('mouseenter', function () {
            if (P && P.menu && P.menu.sub) P.menu.sub(null, 0).catch(function () {});
          });
        });
        // 离开整个父面板（去子菜单/页面）→ 缓冲收起；进入子菜单会被 subHover(true) 抵消
        document.getElementById('panel').addEventListener('mouseleave', function () {
          if (P && P.menu && P.menu.sub) P.menu.sub(null, 0).catch(function () {});
        });
        window.addEventListener('blur', function () {
          if (P && P.menu) P.menu.act('__close');
        });
        setTimeout(reportSize, 50);
      }
    })();
  </script>
</body>
</html>
