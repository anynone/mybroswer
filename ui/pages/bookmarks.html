<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>书签</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px 20px;
      background: #f8f9fa;
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #202124;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 16px; }
    #q {
      width: 100%; padding: 9px 14px; border: 1px solid #dadce0; border-radius: 20px;
      font: inherit; outline: 0; background: #fff; margin-bottom: 16px;
    }
    #q:focus { border-color: #1a73e8; }
    .item {
      background: #fff; border: 1px solid #e8eaed; border-radius: 12px;
      padding: 10px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
      cursor: pointer;
    }
    .item:hover { background: #f8f9fa; }
    .item .fav { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #5f6368; }
    .item .fav img { width: 16px; height: 16px; }
    .item .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .tt .u { display: block; color: #5f6368; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item button {
      flex: none; padding: 5px 12px; border: 1px solid #dadce0; border-radius: 14px;
      background: #fff; cursor: pointer; font: inherit; color: #5f6368;
    }
    .item button:hover { background: #f1f3f4; }
    .item button.warn:hover { color: #d93025; }
    .item input.edit {
      flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid #1a73e8;
      border-radius: 6px; font: inherit; outline: 0;
    }
    .empty { color: #5f6368; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <main>
    <h1>书签</h1>
    <input id="q" type="text" placeholder="搜索书签" spellcheck="false">
    <div id="list"></div>
  </main>
  <script>
    (function () {
      var P = window.polaris;
      var ALL = [];
      function esc(s) { var d = document.createElement('span'); d.textContent = s || ''; return d.innerHTML; }
      function render(list) {
        var box = document.getElementById('list');
        box.innerHTML = '';
        if (!list.length) {
          box.innerHTML = '<div class="empty">暂无书签<br><span style="font-size:12.5px">按 Ctrl+D 或点击地址栏星标收藏当前页面</span></div>';
          return;
        }
        for (var i = 0; i < list.length; i++) {
          (function (b) {
            var el = document.createElement('div');
            el.className = 'item';
            el.innerHTML =
              '<span class="fav">' + (b.favicon ? '<img src="' + esc(b.favicon) + '" onerror="this.remove()">' : esc((b.title || '?').charAt(0))) + '</span>' +
              '<span class="tt"><span class="n">' + esc(b.title) + '</span><span class="u">' + esc(b.url) + '</span></span>' +
              '<button class="rn">重命名</button><button class="rm warn">删除</button>';
            el.onclick = function () { P.tabs.create(b.url); };
            el.querySelector('.rn').onclick = function (e) {
              e.stopPropagation();
              var tt = el.querySelector('.tt');
              var old = el.querySelector('.n').textContent;
              tt.innerHTML = '';
              var input = document.createElement('input');
              input.className = 'edit';
              input.value = old;
              tt.appendChild(input);
              input.focus(); input.select();
              var save = function () { P.bookmarks.rename(b.id, input.value.trim() || old).then(load).catch(function () {}); };
              input.onkeydown = function (ev) {
                if (ev.key === 'Enter') save();
                else if (ev.key === 'Escape') load();
                ev.stopPropagation();
              };
              input.onblur = save;
              input.onclick = function (ev) { ev.stopPropagation(); };
            };
            el.querySelector('.rm').onclick = function (e) {
              e.stopPropagation();
              P.bookmarks.remove(b.id).then(load).catch(function () {});
            };
            box.appendChild(el);
          })(list[i]);
        }
      }
      function load() {
        P.bookmarks.list().then(function (list) {
          ALL = list || [];
          applyFilter();
        }).catch(function () {});
      }
      function applyFilter() {
        var q = document.getElementById('q').value.trim().toLowerCase();
        render(q ? ALL.filter(function (b) {
          return (b.title || '').toLowerCase().indexOf(q) !== -1
            || (b.url || '').toLowerCase().indexOf(q) !== -1;
        }) : ALL);
      }
      document.getElementById('q').addEventListener('input', applyFilter);
      P.onBmChanged(load);
      load();
    })();
  </script>
</body>
</html>
